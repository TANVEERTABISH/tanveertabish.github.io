<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b36"/>
      <stop offset="0.55" stop-color="#15325c"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="vessel4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d1119"/>
      <stop offset="0.5" stop-color="#c3272f"/>
      <stop offset="1" stop-color="#6d1119"/>
    </linearGradient>
    <linearGradient id="strut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c7127"/>
      <stop offset="0.35" stop-color="#f0e2b4"/>
      <stop offset="0.65" stop-color="#c8a84b"/>
      <stop offset="1" stop-color="#7d6322"/>
